[package]
name = "wraithgrid-desktop"
version = "2.5.4"
edition = "2021"
license = "MIT"
publish = false
description = "Wraithgrid on Tauri: the 1.26 React UI in a native webview, backed by the app-rs crates"

[[bin]]
# The name the packages, the .desktop file and the updater expect.
name = "wraithgrid"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
anyhow = "1"
dunce = "=1.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tauri = { version = "=2.12.5", features = ["tray-icon"] }
# Native file and folder dialogs (GTK on Linux, not the xdg portal).
tauri-plugin-dialog = "=2.8.4"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros"] }
wraithgrid-core = { path = "../app-rs/crates/core" }
wraithgrid-chat = { path = "../app-rs/crates/chat" }
wraithgrid-git = { path = "../app-rs/crates/git" }
wraithgrid-mods = { path = "../app-rs/crates/mods" }
wraithgrid-remote = { path = "../app-rs/crates/remote" }
wraithgrid-schedule = { path = "../app-rs/crates/schedule" }
wraithgrid-themes = { path = "../app-rs/crates/themes" }
wraithgrid-usage = { path = "../app-rs/crates/usage" }
wraithgrid-cloud = { path = "../app-rs/crates/cloud" }
# Pane notifications with a click action (`pane:reveal`).
notify-rust = "=4.18.2"
# The relay WebSocket to wraithgrid-server (web app / phone access; src/ipc/relay.rs), rustls
# with webpki roots like the account client's HTTP (ureq).
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Voice typing (src/voice.rs): the microphone (ALSA/WASAPI/CoreAudio), Whisper on this computer
# (whisper.cpp, built with cmake), and the model's download + hash check.
cpal = "=0.18.2"
whisper-rs = "=0.16.0"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
sha2 = "=0.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Message boxes and the clipboard's image, on the GTK main loop Tauri runs (same version as wry's).
gtk = "=0.18.2"

[features]
# Serve the bundled out/tauri-renderer; `--no-default-features` uses the Vite dev server
# (`bun run tauri:dev`) instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Its own workspace: Tauri's wry and the GPUI app's webview pin different webkit2gtk versions.
[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = true
