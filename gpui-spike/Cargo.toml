[package]
name = "wraithgrid-gpui-spike"
version = "0.0.0"
edition = "2021"
description = "Phase 0 spike for the GPUI rewrite (#166): terminal grid, chat bubble, webview pane"
license = "MIT"
publish = false

[[bin]]
name = "wraithgrid-spike"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "=0.26.0"
anyhow = "1"
futures = "=0.3.34"
gpui-kit = "=0.9.1"
gpui-webview = "=0.9.1"
portable-pty = "=0.9.0"
serde_json = "=1.0.154"
wry = { package = "lb-wry", version = "=0.53.3" }

[profile.release]
lto = true
codegen-units = 1
strip = true
