# The crates the shipped Tauri app (desktop-rs) is built on: config, chat, git, cloud… The GPUI
# app that started them (crates/app, ADR 0005) was removed on 2026-11-27. host-rs/ stays outside:
# its build scripts and packaging point at host-rs/target.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
