[package]
name = "wraithgrid-chat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Pinned to the versions already in Cargo.lock; serde_json comes from the workspace (pinned there).
[dependencies]
base64 = "=0.22.1"
# Sent images' thumbnails (#50); already built for GPUI.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"
