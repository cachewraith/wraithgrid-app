[package]
name = "wraithgrid"
version = "2.0.0-alpha.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Wraithgrid on GPUI (#166)"

[[bin]]
name = "wraithgrid"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "=0.26.0"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
anyhow.workspace = true
futures = "=0.3.34"
gpui-kit = "=0.9.1"
serde_json.workspace = true
wraithgrid-core = { path = "../core" }
wraithgrid-chat = { path = "../chat" }
wraithgrid-git = { path = "../git" }
wraithgrid-mods = { path = "../mods" }
wraithgrid-schedule = { path = "../schedule" }
wraithgrid-themes = { path = "../themes" }
wraithgrid-usage = { path = "../usage" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
