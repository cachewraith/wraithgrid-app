name: gpui

# The GPUI rewrite (#166, ADR 0005): the Phase 0 spike and the app-rs workspace, built and
# tested on every OS the app ships for; release binaries are kept for trying by hand.
on:
  push:
    branches: [main]
    paths: ['gpui-spike/**', 'app-rs/**', '.github/workflows/gpui.yml']
  pull_request:
    paths: ['gpui-spike/**', 'app-rs/**', '.github/workflows/gpui.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Upload the packages to this (draft) GitHub release instead of artifacts
        required: false
        default: ''
      update_feeds:
        description: Also upload latest*.yml, so installed copies update to this release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  spike:
    name: spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc, as the Linux packages use; WebKitGTK 4.1 is in its archive.
          - os: ubuntu-22.04
            bin: wraithgrid-spike
          - os: windows-latest
            bin: wraithgrid-spike.exe
          - os: macos-latest
            bin: wraithgrid-spike
          - os: macos-15-intel
            bin: wraithgrid-spike
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gpui-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux libraries (GPUI, WebKitGTK)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-x11-dev libwayland-dev
          libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
          libzstd-dev libssl-dev libasound2-dev
      - name: cargo fmt, clippy, test
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Release build and size
        shell: bash
        run: |
          cargo build --release --locked
          ls -l target/release/${{ matrix.bin }}
      # A convenience copy for trying by hand: a full artifact quota must not fail a build
      # that passed (the first run on main hit it on every OS).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: wraithgrid-spike-${{ matrix.os }}
          path: gpui-spike/target/release/${{ matrix.bin }}
          retention-days: 14

  app-rs:
    name: app-rs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux libraries (GPUI)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev
          libfontconfig-dev libfreetype-dev libzstd-dev libssl-dev libasound2-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: cargo fmt, clippy, test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Release build and size
        shell: bash
        run: |
          cargo build --release --locked -p wraithgrid
          ls -l target/release/wraithgrid*

  # The GPUI app's Linux packages, named and laid out as the Electron ones (#166 phase 6), on
  # Ubuntu 22.04's glibc so they run on newer distros too.
  app-rs-linux-packages:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Libraries and packaging tools
        run: |
          sudo apt-get update
          # desktop-file-utils: appimagetool refuses to run without desktop-file-validate.
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libzstd-dev libssl-dev libasound2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            ruby ruby-dev rpm libarchive-tools imagemagick desktop-file-utils
          sudo gem install --no-document fpm -v 1.16.0
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Build the host and the app
        run: |
          cargo build --release --locked --manifest-path host-rs/Cargo.toml
          cargo build --release --locked --manifest-path app-rs/Cargo.toml -p wraithgrid
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: app-rs/packaging/linux/package.sh all
      - name: Upload to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FEEDS: ${{ inputs.update_feeds }}
        # The latest*.yml update feeds only when asked (a pre-release must not reach installed
        # copies); never this OS's SHA256SUMS.txt, as the release needs one for every OS.
        run: |
          files=$(ls app-rs/target/dist/* | grep -v '/SHA256SUMS.txt$')
          if [ "$FEEDS" != true ]; then files=$(echo "$files" | grep -Ev '/latest[^/]*\.yml$'); fi
          gh release upload "$TAG" $files --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.release_tag == ''
        with:
          name: wraithgrid-gpui-linux-packages
          path: app-rs/target/dist/*
          retention-days: 14

  # The GPUI app's Windows installer, as electron-builder's NSIS one (same name, folder,
  # registry keys and uninstaller), with latest.yml so Electron installs update into it.
  # Artifacts only: release.yml still ships the Electron builds. Unsigned (see package.sh).
  app-rs-windows-package:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: NSIS
        run: |
          if ! command -v makensis >/dev/null && [[ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]]; then
            choco install nsis -y --no-progress
          fi
      - name: Build the host and the app
        run: |
          cargo build --release --locked --manifest-path host-rs/Cargo.toml
          cargo build --release --locked --manifest-path app-rs/Cargo.toml -p wraithgrid
      - name: Package
        run: app-rs/packaging/windows/package.sh
      - name: Upload to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FEEDS: ${{ inputs.update_feeds }}
        # The latest*.yml update feeds only when asked (a pre-release must not reach installed
        # copies); never this OS's SHA256SUMS.txt, as the release needs one for every OS.
        run: |
          files=$(ls app-rs/target/dist/* | grep -v '/SHA256SUMS.txt$')
          if [ "$FEEDS" != true ]; then files=$(echo "$files" | grep -Ev '/latest[^/]*\.yml$'); fi
          gh release upload "$TAG" $files --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.release_tag == ''
        with:
          name: wraithgrid-gpui-windows-package
          path: app-rs/target/dist/*
          retention-days: 14

  # The GPUI app's macOS packages (Apple Silicon and Intel, built on one arm64 runner), named
  # and laid out as electron-builder's, with latest-mac.yml. Artifacts only; ad-hoc signed like
  # the Electron builds (signing/notarizing env names are in package.sh).
  app-rs-macos-packages:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the host (universal) and the app per CPU
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/build-mac-host.sh
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --manifest-path app-rs/Cargo.toml -p wraithgrid --target "$t"
          done
      - name: Package
        run: app-rs/packaging/macos/package.sh x64 arm64
      - name: Upload to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FEEDS: ${{ inputs.update_feeds }}
        # The latest*.yml update feeds only when asked (a pre-release must not reach installed
        # copies); never this OS's SHA256SUMS.txt, as the release needs one for every OS.
        run: |
          files=$(ls app-rs/target/dist/* | grep -v '/SHA256SUMS.txt$')
          if [ "$FEEDS" != true ]; then files=$(echo "$files" | grep -Ev '/latest[^/]*\.yml$'); fi
          gh release upload "$TAG" $files --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.release_tag == ''
        with:
          name: wraithgrid-gpui-macos-packages
          path: app-rs/target/dist/*
          retention-days: 14
