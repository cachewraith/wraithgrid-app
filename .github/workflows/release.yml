name: release

# Push a version tag to publish a release:
#   bun pm version patch -m "chore: release %s" && git push --follow-tags
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      package: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wraithgrid-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Releases go to the public cachewraith/wraithgrid (this source repo is private): installed
      # copies check it for updates, the website links to it, install.sh downloads from it.
      # RELEASES_TOKEN: fine-grained token, Contents read/write on cachewraith/wraithgrid only.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASES_REPO: cachewraith/wraithgrid
        # The body is the version's section of docs/WHATS-NEW.md (what the app's About shows). No
        # PR list: it would link to this private repo.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the RELEASES_TOKEN secret (Contents read/write on $RELEASES_REPO)"
            exit 1
          fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if ! bun scripts/release-notes.ts "$TAG" > notes.md; then
            printf 'Wraithgrid %s. See **Settings → About** in the app for what changed.\n' "${TAG#v}" > notes.md
          fi
          gh release create "$TAG" dist/* \
            --repo "$RELEASES_REPO" \
            --target main \
            --title "Wraithgrid ${TAG#v}" \
            --notes-file notes.md \
            "${prerelease[@]}"
