name: desktop

# The desktop app that ships: the Tauri app (desktop-rs) and the app-rs crates it is built on,
# checked on every push to main; run by hand with `release_tag` to build the installers for a
# release (the staging draft `desktop-vX.Y.Z` in this repo, then published to
# cachewraith/wraithgrid). The GPUI rewrite and its spike were removed (ADR 0005).
on:
  push:
    branches: [main]
    paths: ['app-rs/**', 'desktop-rs/**', 'host-rs/**', 'src/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['app-rs/**', 'desktop-rs/**', 'host-rs/**', 'src/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Upload the packages to this (draft) GitHub release instead of artifacts
        required: false
        default: ''
      update_feeds:
        description: Also upload latest*.yml, so installed copies update to this release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The crates the Tauri app is built on (config, chat, git, cloud…), on every OS it ships for.
  app-rs:
    name: app-rs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo fmt, clippy, test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  # The Tauri app's Linux packages, named and laid out as the Electron ones (#166 phase 6), on
  # Ubuntu 22.04's glibc so they run on newer distros too.
  # The Tauri app (desktop-rs): the 1.26 React UI on a Rust backend, the app that ships.
  desktop-rs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux libraries (Tauri)
        run: >
          sudo apt-get update && sudo apt-get install -y
          libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Renderer (the 1.26 React UI the Tauri app embeds)
        shell: bash
        run: bun install --frozen-lockfile && bun run tauri:renderer
      - name: cargo fmt, clippy, test
        working-directory: desktop-rs
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  app-rs-linux-packages:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Libraries and packaging tools
        run: |
          sudo apt-get update
          # desktop-file-utils: appimagetool refuses to run without desktop-file-validate.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev zstd \
            ruby ruby-dev rpm libarchive-tools imagemagick desktop-file-utils
          sudo gem install --no-document fpm -v 1.16.0
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Renderer (the 1.26 React UI the Tauri app embeds)
        shell: bash
        run: bun install --frozen-lockfile && bun run tauri:renderer
      - name: Build the host and the app
        run: |
          cargo build --release --locked --manifest-path host-rs/Cargo.toml
          cargo build --release --locked --manifest-path desktop-rs/Cargo.toml
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: app-rs/packaging/linux/package.sh all
      - name: Upload to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FEEDS: ${{ inputs.update_feeds }}
        # The latest*.yml update feeds only when asked (a pre-release must not reach installed
        # copies); never this OS's SHA256SUMS.txt, as the release needs one for every OS.
        run: |
          files=$(ls app-rs/target/dist/* | grep -v '/SHA256SUMS.txt$')
          if [ "$FEEDS" != true ]; then files=$(echo "$files" | grep -Ev '/latest[^/]*\.yml$'); fi
          gh release upload "$TAG" $files --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.release_tag == ''
        with:
          name: wraithgrid-desktop-linux-packages
          path: app-rs/target/dist/*
          retention-days: 14

  # The Tauri app's Windows installer, as electron-builder's NSIS one (same name, folder,
  # registry keys and uninstaller), with latest.yml so Electron installs update into it.
  # Artifacts only: release.yml still ships the Electron builds. Unsigned (see package.sh).
  app-rs-windows-package:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: NSIS
        run: |
          if ! command -v makensis >/dev/null && [[ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]]; then
            choco install nsis -y --no-progress
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Renderer (the 1.26 React UI the Tauri app embeds)
        shell: bash
        run: bun install --frozen-lockfile && bun run tauri:renderer
      - name: Build the host and the app
        run: |
          cargo build --release --locked --manifest-path host-rs/Cargo.toml
          cargo build --release --locked --manifest-path desktop-rs/Cargo.toml
      - name: Package
        run: app-rs/packaging/windows/package.sh
      - name: Upload to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FEEDS: ${{ inputs.update_feeds }}
        # The latest*.yml update feeds only when asked (a pre-release must not reach installed
        # copies); never this OS's SHA256SUMS.txt, as the release needs one for every OS.
        run: |
          files=$(ls app-rs/target/dist/* | grep -v '/SHA256SUMS.txt$')
          if [ "$FEEDS" != true ]; then files=$(echo "$files" | grep -Ev '/latest[^/]*\.yml$'); fi
          gh release upload "$TAG" $files --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.release_tag == ''
        with:
          name: wraithgrid-desktop-windows-package
          path: app-rs/target/dist/*
          retention-days: 14

  # The Tauri app's macOS packages (Apple Silicon and Intel, built on one arm64 runner), named
  # and laid out as electron-builder's, with latest-mac.yml. Artifacts only; ad-hoc signed like
  # the Electron builds (signing/notarizing env names are in package.sh).
  app-rs-macos-packages:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Renderer (the 1.26 React UI the Tauri app embeds)
        shell: bash
        run: bun install --frozen-lockfile && bun run tauri:renderer
      - name: Build the host (universal) and the app per CPU
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/build-mac-host.sh
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --manifest-path desktop-rs/Cargo.toml --target "$t"
          done
      - name: Package
        run: app-rs/packaging/macos/package.sh x64 arm64
      - name: Upload to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FEEDS: ${{ inputs.update_feeds }}
        # The latest*.yml update feeds only when asked (a pre-release must not reach installed
        # copies); never this OS's SHA256SUMS.txt, as the release needs one for every OS.
        run: |
          files=$(ls app-rs/target/dist/* | grep -v '/SHA256SUMS.txt$')
          if [ "$FEEDS" != true ]; then files=$(echo "$files" | grep -Ev '/latest[^/]*\.yml$'); fi
          gh release upload "$TAG" $files --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.release_tag == ''
        with:
          name: wraithgrid-desktop-macos-packages
          path: app-rs/target/dist/*
          retention-days: 14
